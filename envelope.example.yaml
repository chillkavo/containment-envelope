envelope_id: eval-agent-web-lookup
version: 3
emitido: 2026-06-28T00:00:00Z
descripcion: >
  Agente de evaluacion con tareas de consulta web multironda.
  Solo lectura. Sin publicacion externa. Sesion de un solo uso.

red:
  destinos_permitidos:
    - host: docs.python.org
      puerto: 443
      protocolo: https
    - host: api.internal.lab
      puerto: 443
      protocolo: https
    - host: cache.internal.lab
      puerto: 443
      protocolo: https
  egreso_terminado_en_L7: true
  metodos_permitidos:
    - GET
    - HEAD
  bytes_max_salida: 50000000

credenciales:
  secretos_montados:
    - ref:eval-readonly-token
  ttl_segundos: 3600

herramientas:
  herramientas_invocables:
    - http_get@a91f3c
    - buscar@77c0de
    - leer_archivo@33be21
    - python_exec@5d8a04
  subagentes_max: 0

archivos:
  rutas_escribibles:
    - /workspace/out
    - /tmp

computo:
  definicion_de_paso: llamada_modelo
  pasos_max: 5000

persistencia:
  publicacion_externa_permitida: []
  recursos_a_destruir:
    - contenedor
    - volumen
    - token
